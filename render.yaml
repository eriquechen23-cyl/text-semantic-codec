services:
  - type: web
    name: text-semantic-codec-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: text-semantic-codec-ui
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist/text-semantic-codec-ui/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
